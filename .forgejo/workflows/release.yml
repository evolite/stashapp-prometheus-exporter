on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-image:
    runs-on: orange-runner
    steps:
      - uses: actions/checkout@v3

      - name: Install Docker CLI
        run: apt-get update -qq && apt-get install -y -qq docker.io

      - name: Build and push image
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login codeberg.org -u surging9143 --password-stdin
          docker build \
            -t codeberg.org/surging9143/stashapp-prometheus-exporter:${{ github.ref_name }} \
            -t codeberg.org/surging9143/stashapp-prometheus-exporter:latest \
            .
          docker push codeberg.org/surging9143/stashapp-prometheus-exporter:${{ github.ref_name }}
          docker push codeberg.org/surging9143/stashapp-prometheus-exporter:latest

  release:
    runs-on: orange-runner
    needs: publish-image
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create release
        run: |
          git fetch --tags --force
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s" | grep -viE "^- bump version" || true)
          fi
          export NOTES="${NOTES:-No changelog available.}"
          SHA=$(git rev-parse HEAD)
          curl -sL -X POST \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/surging9143/stashapp-prometheus-exporter/releases" \
            -d "$(python3 -c "import json,os; print(json.dumps({'tag_name':'${CURRENT_TAG}','name':'${CURRENT_TAG}','body':os.environ['NOTES'],'target_commitish':'$SHA','draft':False,'prerelease':False}))")"
