on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: orange-runner
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Debug runner environment
        run: |
          echo "=== user ===" && id
          echo "=== docker socket ===" && ls -la /var/run/docker.sock 2>/dev/null || echo "no docker socket"
          echo "=== docker ===" && which docker 2>/dev/null && docker version 2>/dev/null || echo "no docker"
          echo "=== podman ===" && which podman 2>/dev/null || echo "no podman"
          echo "=== buildah ===" && which buildah 2>/dev/null || echo "no buildah"
          echo "=== kernel ===" && uname -r
          echo "=== seccomp ===" && cat /proc/self/status | grep -i seccomp || true
          echo "=== userns ===" && cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo "not available"

      - name: Create release
        run: |
          git fetch --tags --force
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s" | grep -viE "^- bump version" || true)
          fi
          export NOTES="${NOTES:-No changelog available.}"
          SHA=$(git rev-parse HEAD)
          curl -sL -X POST \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/surging9143/stashapp-prometheus-exporter/releases" \
            -d "$(python3 -c "import json,os; print(json.dumps({'tag_name':'${CURRENT_TAG}','name':'${CURRENT_TAG}','body':os.environ['NOTES'],'target_commitish':'$SHA','draft':False,'prerelease':False}))")"
